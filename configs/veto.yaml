method: veto
backbone: gpt-4o
provider_mode: cached_replay
temperature_plan: 0.2
temperature_exec: 0.0
repair_budget: 3
replan_budget: 2
broker_k: 15
agent_roles:
  planner:
    input_slots: [query, artefact, constraints, counter_evidence]
    output_slots: [constraint_schema, plan_dag]
    exemplars_per_domain: 4
  broker:
    retrieval: dense_hash_384
    reranker: cached_policy
    bind: [artefact, units, coordinate_frame]
  executor:
    mode: sandboxed_tool_call
    may_revise_plan: false
  verifier:
    deterministic: true
    can_commit: true
  supervisor:
    states: [PLAN, SELECT, EXECUTE, VERIFY, COMMIT, REPAIR, REPLAN, ESCALATE]
sandbox:
  timeout_s: 120
  memory_mb: 2048
  max_output_mb: 32
  working_directory: outputs/sandbox
evaluation:
  runs: 3
  bootstrap_samples: 10000
  report_faithfulness_audit_tasks: 40
