seed: 42
d_obs: 32
d_model: 128
n_layers: 2
n_tools: 42
train_epochs: 35
train_batch_size: 2
train_pace_sec: 2.0
lr: 0.0003
weight_decay: 0.0001
early_stop_patience: 8
hard_tier_boost: 2.4
amp: true
device: auto
main_run: veto_gpt4o_r1
train_split: policy_train
val_split: policy_val
test_split: test
num_workers: 0
optimizer:
  name: AdamW
  lr: 0.0003
  weight_decay: 0.0001
scheduler:
  name: cosine
  min_lr: 0.000001
loss:
  verdict: 1.0
  csr: 0.15
  broker: 0.05
sampling:
  replacement: true
  hard_tiers: [T3, T4, C3, C4]
  hard_tier_boost: 2.4
  failed_task_boost: 1.3
checkpoint:
  monitor: val_match_accuracy
  mode: max
  save_optimizer: true
  save_scaler: true
