methods:
  direct:
    tool_access: false
    retrieval: false
    domains: [bim, cad]
  rag:
    tool_access: false
    retrieval: [provisions, tool_docs, artefact_extracts]
    domains: [bim, cad]
  react:
    agents: 1
    tool_access: full_registry
    verifier: false
    domains: [bim, cad]
  pipeline:
    agents: 1
    tool_access: fixed_domain_sequence
    verifier: false
    domains: [bim, cad]
  react_verifier:
    agents: 1
    tool_access: full_registry
    verifier: deterministic
    repair_budget: 3
    replan_budget: 2
    domains: [bim, cad]
  mas:
    agents: [planner, broker, executor]
    blackboard: typed
    verifier: conversational_self_check
    recovery_supervisor: false
    domains: [bim, cad]
  acc:
    workflow: [interpret_clause, extract_data, execute_check, render_report]
    domains: [bim]
  visual_cad:
    workflow: [generate_cadquery, render, critique, revise]
    max_revisions: 3
    domains: [cad]
  veto:
    agents: [planner, broker, executor]
    blackboard: typed
    verifier: deterministic
    repair_budget: 3
    replan_budget: 2
    broker_k: 15
    domains: [bim, cad]

